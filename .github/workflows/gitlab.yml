name: Sync to GitLab

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  delete:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository to GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_PAT }}
        run: |
          # Clone bare repository without GitHub-internal refs/pull/*
          git clone --bare "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mirror.git
          cd mirror.git
          # Sync all branches and tags, pruning deleted refs on GitLab
          git push --prune --force "https://oauth2:${GITLAB_TOKEN}@gitlab.com/endeavouros-filemirror/${GITHUB_REPOSITORY#*/}.git" \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
